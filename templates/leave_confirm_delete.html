<!DOCTYPE html>
<html>
<head>
    <style>
        body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f8f9fa;
    padding: 50px;
}

h1 {
    color: #dc3545;
}

p {
    font-size: 18px;
    color: #333;
}

strong {
    font-weight: bold;
}

form {
    margin-top: 20px;
}

button {
    background-color: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s ease;
}

button:hover {
    background-color: #c82333;
}

a {
    display: inline-block;
    margin-left: 15px;
    padding: 10px 20px;
    text-decoration: none;
    color: white;
    background-color: #6c757d;
    border-radius: 5px;
    font-size: 16px;
    transition: background 0.3s ease;
}

a:hover {
    background-color: #5a6268;
}

    </style>
    <title>Delete Leave</title>
</head>
<body>
    
    <h1>Confirm Delete</h1>
    <p>Are you sure you want to delete this leave?</p>
    <p><strong>{{ leave.student.name }}</strong> - {{ leave.start_date }} to {{ leave.end_date }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'leave_list' %}">Cancel</a>
    </form>
</body>
</html>
