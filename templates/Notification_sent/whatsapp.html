<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Notifications</title>
</head>
<body>
    <h2>WhatsApp Notifications Sent</h2>
    
    {% if notified_students %}
        <h3>Absent Students:</h3>
        <ul>
            {% for student in notified_students %}
                <li>{{ student.name }} ({{ student.phone_number }})</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No absent students today.</p>
    {% endif %}
</body>
</html>
